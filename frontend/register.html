<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Online Course Learning Management System</title>
    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="/public/css/navbar.css">
    <link rel="stylesheet" href="/public/css/responsive.css">
</head>
<body style="background-color: #f1f5f9;">
    <!-- Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">Learn<span>Hub</span></span>
            </a>
            <nav class="nav-links" id="navLinks">
                <a href="/">Home</a>
                <a href="/courses.html">Browse Courses</a>
            </nav>
            <div class="nav-actions">
                <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
            </div>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </header>

    <main class="page-container" style="display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 180px);">
        <div style="width: 100%; max-width: 500px;">
            <div style="background: #ffffff; padding: 40px; border-radius: 20px; box-shadow: var(--shadow-card); border: 1px solid var(--card-border);">
                <div style="text-align: center; margin-bottom: 28px;">
                    <span class="badge badge-purple" style="margin-bottom: 10px;">Get Started</span>
                    <h2 style="font-size: 1.8rem; color: var(--navy-900);">Join LearnHub Today</h2>
                    <p style="color: var(--text-muted); font-size: 0.95rem;">Choose your path as a Student or certified Instructor</p>
                </div>

                <div id="authAlert" class="alert d-none"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required placeholder="Lokesh Yadav" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required placeholder="user@example.com" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="password">Create Password *</label>
                        <input type="password" id="password" name="password" required placeholder="Minimum 6 characters" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="role">Account Type</label>
                        <select id="role" name="role" class="form-control" style="font-weight:600;">
                            <option value="student">🎓 Student — I want to enroll & learn</option>
                            <option value="instructor">👨‍🏫 Instructor — I want to create & manage courses</option>
                        </select>
                    </div>

                    <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-block btn-large" style="margin-top: 10px;">
                        Complete Registration
                    </button>
                </form>

                <div style="text-align: center; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--card-border); font-size: 0.92rem;">
                    Already have an account? <a href="/login.html" style="font-weight: 700;">Sign in here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container footer-bottom">
            <div>&copy; 2026 Online Course Learning Management System.</div>
            <div class="developer-credit">
                Project Title: <strong>Online Course Learning Management System</strong> | Developed by <strong>Lokesh Yadav</strong>
            </div>
        </div>
    </footer>

    <script src="/public/js/main.js"></script>
    <script src="/public/js/auth.js"></script>
</body>
</html>
